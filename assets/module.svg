<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="nanoadmin: every console edit and every service read lands in the admin_ catalogue">
  <title>nanoadmin</title>
  <defs>
    <style>
      .txt { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .chip { fill: #F1F5F9; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 2; }
      .wire { stroke: #CBD5E1; stroke-width: 2; }
      .ink { fill: #0F172A; }
      .dim { fill: #64748B; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#FFFFFF"/>

  <g class="txt" font-size="12.5" fill="#334155" text-anchor="middle">
    <rect class="chip" x="56" y="34" width="190" height="36" rx="10"/><text x="151" y="57">console (portal)</text>
    <rect class="chip" x="264" y="34" width="190" height="36" rx="10"/><text x="359" y="57">agent containers</text>
    <rect class="chip" x="472" y="34" width="190" height="36" rx="10"/><text x="567" y="57">gateway · auth</text>
    <rect class="chip" x="680" y="34" width="190" height="36" rx="10"/><text x="775" y="57">provisioner</text>
  </g>

  <g class="wire">
    <line x1="151" y1="70" x2="151" y2="94"/>
    <line x1="359" y1="70" x2="359" y2="94"/>
    <line x1="567" y1="70" x2="567" y2="94"/>
    <line x1="775" y1="70" x2="775" y2="94"/>
    <line x1="151" y1="94" x2="775" y2="94"/>
    <line x1="480" y1="94" x2="480" y2="112"/>
  </g>

  <rect x="260" y="112" width="440" height="56" rx="12" fill="#EEF2FF" stroke="#2F6BFF" stroke-width="2.5"/>
  <text class="txt ink" x="480" y="136" font-size="15" font-weight="700" text-anchor="middle">nanoadmin</text>
  <text class="txt dim" x="480" y="155" font-size="10.5" text-anchor="middle">catalogue · configuration · audit · alerts</text>

  <g class="wire">
    <line x1="480" y1="168" x2="480" y2="192"/>
    <line x1="168" y1="192" x2="792" y2="192"/>
    <line x1="168" y1="192" x2="168" y2="216"/>
    <line x1="324" y1="192" x2="324" y2="216"/>
    <line x1="480" y1="192" x2="480" y2="216"/>
    <line x1="636" y1="192" x2="636" y2="216"/>
    <line x1="792" y1="192" x2="792" y2="216"/>
  </g>

  <g class="mono" font-size="10" fill="#334155" text-anchor="middle">
    <rect class="card" x="88" y="216" width="160" height="34" rx="8"/><text x="168" y="237">admin_config</text>
    <rect class="card" x="244" y="216" width="160" height="34" rx="8"/><text x="324" y="237">admin_agent_types</text>
    <rect class="card" x="400" y="216" width="160" height="34" rx="8"/><text x="480" y="237">admin_models</text>
    <rect class="card" x="556" y="216" width="160" height="34" rx="8"/><text x="636" y="237">admin_skills · prompts</text>
    <rect class="card" x="712" y="216" width="160" height="34" rx="8"/><text x="792" y="237">admin_audit_log</text>
  </g>

  <rect x="88" y="272" width="784" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text class="txt" x="480" y="293" font-size="10.5" fill="#475569" text-anchor="middle">plus permission keys, MCP servers, model providers, agent-type overrides, alert rules and prompt blocks — all under one prefix</text>
  <text class="txt dim" x="480" y="308" font-size="10" text-anchor="middle">a change is announced to the bus and the provisioner, so their cached copy is dropped instead of waiting for a restart</text>

  <rect x="88" y="336" width="784" height="48" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="txt" x="480" y="356" font-size="10.5" fill="#475569" text-anchor="middle">seeding is additive: a bundled prompt, skill or agent type is inserted only when absent,</text>
  <text class="txt dim" x="480" y="372" font-size="10" text-anchor="middle">so the version an operator edited stays edited — which is why it runs on every start</text>
</svg>
